[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "nslsii"
description = "Tools for data collection and analysis at NSLS-II"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [{ name = "Brookhaven National Laboratory" }]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "appdirs",
  "bluesky-kafka>=0.8.0",
  "bluesky>=1.8.1",
  "caproto",
  "databroker",
  "h5py",
  "ipython",
  "ipywidgets",
  "matplotlib",
  "msgpack>=1.0.0",
  "msgpack-numpy",
  "numpy",
  "opencv-python",
  "ophyd",
  "ophyd-async",
  "packaging",
  "pillow",
  "psutil",
  "pycryptodome",
  "pyolog",
  "PyYAML",
  "redis",
  "redis-json-dict",
  "requests",
  "shortuuid",
]
dynamic = ["version"]

[project.optional-dependencies]
sync-experiment = [
  "httpx",
  "ldap3",
]
dev = [
  "nslsii[sync-experiment]",
  "area_detector_handlers",
  "attrs>=17.4.0",
  "build",
  "coverage",
  "doct",
  "ipython",
  "matplotlib",
  "numpydoc",
  "pims",
  "pre-commit",
  "pytest",
  "pytz",
  "ruff",
  "sphinx",
  "sphinx_rtd_theme",
]

[project.scripts]
sync-experiment = "nslsii.sync_experiment:main"
what-is-ioc = "nslsii.epics_utils:main"
axis-saver-ioc = "nslsii.iocs.caproto_saver:start_axis_ioc"

[project.urls]
Homepage = "https://github.com/NSLS-II/nslsii"
"Bug Reports" = "https://github.com/NSLS-II/nslsii/issues"

[tool.hatch]
version.source = "vcs"

[tool.hatch.build]
artifacts = ["nslsii/_version.py"]

[tool.hatch.build.targets.sdist]
include = [
  "/docs",
  "/nslsii",
  "/scripts",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["nslsii"]

[tool.hatch.build.hooks.vcs]
version-file = "nslsii/_version.py"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.pytest.ini_options]
log_cli = true
log_cli_format = "%(asctime)s - %(threadName)s - %(name)s - [%(filename)s #%(lineno)s] - %(levelname)s - %(message)s"
log_cli_level = "WARNING"
testpaths = ["nslsii/tests"]

[tool.ruff]
line-length = 115
target-version = "py310"
exclude = [
  ".git",
  ".pixi",
  ".venv",
  "build",
  "dist",
  "docs/source/conf.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
